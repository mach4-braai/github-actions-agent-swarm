# S1 spike (issue #1): prove the DeepSeek agent loop runs in Actions.
# Throwaway. Superseded by the reusable workflow in S2/S3.
name: spike-agent

run-name: spike/${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      label:
        description: correlation label
        required: true
        type: string

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Run agent against DeepSeek
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
        run: |
          set -o pipefail
          claude -p "$(cat spike/task.md)" \
            --output-format json \
            --dangerously-skip-permissions \
            | tee agent-output.json

      - name: Assert read + edit + shell all happened
        run: |
          set -euo pipefail

          echo "--- target.txt ---"
          cat spike/target.txt

          # (2) the edit
          grep -qx 'SPIKE-OK' spike/target.txt \
            || { echo "FAIL: no SPIKE-OK line — the agent did not edit the file"; exit 1; }

          # (3) the shell command. The expected value is a sha256 prefix of the
          # POST-EDIT file, so it cannot be guessed or reasoned out — only a real
          # shell invocation, after a real edit, produces it.
          test -f spike/proof.txt \
            || { echo "FAIL: no proof.txt — the agent did not run the command"; exit 1; }

          expected="$(sha256sum spike/target.txt | cut -c1-12)"
          actual="$(tr -d '[:space:]' < spike/proof.txt)"
          echo "expected=$expected actual=$actual"
          [ "$expected" = "$actual" ] \
            || { echo "FAIL: proof mismatch — shell output not genuine"; exit 1; }

          echo "PASS: read + edit + shell verified"

      - name: Report diff and usage
        if: always()
        run: |
          {
            echo '## Diff'
            echo '```'
            git --no-pager diff --stat || true
            git --no-pager diff || true
            echo '```'
            echo '## Agent result'
            echo '```json'
            jq '{num_turns, is_error, subtype, duration_ms, usage, total_cost_usd}' \
              agent-output.json 2>/dev/null || echo 'no parseable output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-output
          path: |
            agent-output.json
            spike/
          if-no-files-found: warn
