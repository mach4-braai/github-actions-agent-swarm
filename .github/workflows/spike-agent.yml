# S1 spike (issue #1): prove the DeepSeek agent loop runs in Actions.
# Throwaway. Superseded by the reusable workflow in S2/S3.
name: spike-agent

run-name: spike/${{ inputs.label }}

on:
  workflow_dispatch:
    inputs:
      label:
        description: correlation label
        required: true
        type: string

permissions:
  contents: read

jobs:
  spike:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Seed runtime nonce
        run: |
          NONCE="nonce-$(openssl rand -hex 16)"
          echo "$NONCE" >> spike/target.txt
          echo "seeded: $NONCE"

      - name: Run agent against DeepSeek
        env:
          ANTHROPIC_BASE_URL: https://api.deepseek.com/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_OPUS_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_SONNET_MODEL: deepseek-v4-pro[1m]
          ANTHROPIC_DEFAULT_HAIKU_MODEL: deepseek-v4-flash
          CLAUDE_CODE_SUBAGENT_MODEL: deepseek-v4-flash
        run: |
          set -o pipefail
          claude -p "$(cat spike/task.md)" \
            --output-format stream-json \
            --verbose \
            --dangerously-skip-permissions \
            | tee stream.jsonl

      - name: Assert Bash was actually invoked
        run: |
          set -euo pipefail

          echo "--- tool calls observed ---"
          jq -r 'select(.type=="assistant")
                 | .message.content[]?
                 | select(.type=="tool_use")
                 | .name' stream.jsonl | sort | uniq -c | tee tools.txt

          grep -qw 'Bash' tools.txt \
            || { echo "FAIL: no Bash tool_use event — shell execution unproven"; exit 1; }
          grep -qwE 'Read' tools.txt \
            || { echo "FAIL: no Read tool_use event"; exit 1; }

          echo "PASS: Bash and Read tool_use events observed"

      - name: Assert read + edit + shell all happened
        run: |
          set -euo pipefail

          echo "--- target.txt ---"
          cat spike/target.txt

          grep -qx 'SPIKE-OK' spike/target.txt \
            || { echo "FAIL: no SPIKE-OK line — the agent did not edit the file"; exit 1; }

          test -f spike/proof.txt \
            || { echo "FAIL: no proof.txt — the agent did not run the command"; exit 1; }

          expected="$(sha256sum spike/target.txt | cut -c1-12)"
          actual="$(tr -d '[:space:]' < spike/proof.txt)"
          echo "expected=$expected actual=$actual"
          [ "$expected" = "$actual" ] \
            || { echo "FAIL: proof mismatch — hash not genuine"; exit 1; }

          echo "PASS: read + edit + shell verified against a runtime nonce"

      - name: Report diff and usage
        if: always()
        run: |
          {
            echo '## Tools invoked'
            echo '```'
            cat tools.txt 2>/dev/null || echo 'none captured'
            echo '```'
            echo '## Diff'
            echo '```'
            git --no-pager diff --stat || true
            echo '```'
            echo '## Agent result'
            echo '```json'
            jq -c 'select(.type=="result")
                   | {num_turns, is_error, subtype, duration_ms, usage, total_cost_usd}' \
              stream.jsonl 2>/dev/null || echo 'no parseable result event'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-output
          path: |
            stream.jsonl
            tools.txt
            spike/
          if-no-files-found: warn
